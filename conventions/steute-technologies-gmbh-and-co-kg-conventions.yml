authentication:
  style: jwt-in-custom-header
  detail: >-
    POST /api/v2/auth/login with username/password returns a JWT accessToken
    (30-minute TTL) and refreshToken; subsequent requests carry the JWT in the
    JWTAuthorization header. See authentication/steute-technologies-gmbh-and-co-kg-authentication.yml.
idempotency:
  supported: false
  detail: >-
    No idempotency-key header or mechanism is documented. Most write operations
    are PUT updates or DELETEs keyed by deviceId/id, which are naturally
    idempotent, but there is no client idempotency contract for POST creates.
pagination:
  supported: false
  detail: >-
    List endpoints (switches, switch-groups, access-points, notification-configs,
    history) return complete arrays; no pagination parameters are declared in the
    OpenAPI or documented.
versioning:
  scheme: uri-path
  current: v2
  detail: >-
    Version pinned in the URL path (/api/v2). REST API v1 (/api/v1) was
    deprecated in 2022 and removed in Sensor Bridge 2.5.0 (06.02.2025). See
    lifecycle/steute-technologies-gmbh-and-co-kg-lifecycle.yml.
