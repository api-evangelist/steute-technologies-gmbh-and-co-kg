  detail: No rate-limit headers or quotas are documented; the API is served by an on-premise gateway device.
eventing:
  style: http-post-notifications
  detail: >-
    Push integration is done via configurable HTTP(S) POST notifications
    (switchEvent / missingSwitchWakeupWarning JSON messages) rather than
    client polling; supports HTTP Basic auth, per-group filtering and
    configurable timeouts. See asyncapi/steute-technologies-gmbh-and-co-kg-webhooks-asyncapi.yml.
