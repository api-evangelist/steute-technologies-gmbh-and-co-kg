aid: steute-technologies-gmbh-and-co-kg
name: steute Technologies GmbH & Co. KG
description: >-
  steute Technologies GmbH & Co. KG is a German industrial technology company headquartered in
  Löhne that develops switchgear, sensors and controls under the tagline "Applied Intelligence",
  organized into three divisions: Meditec (certified user interfaces such as foot and hand
  controls for medical devices), Controltec (safe industrial automation with switches, sensors
  and wireless solutions) and Leantec (digital shop floor solutions). Its Leantec "nexy" IIoT
  wireless network, built on the sWave.NET radio protocol, connects hundreds of wireless switches
  and sensors to shop-floor IT through a Sensor Bridge gateway that exposes a JWT-secured REST
  API (OpenAPI 3.0), HTTP(S) push notifications, Modbus TCP and optional OPC UA and SAP modules
  for eKanban, AGV, Andon and material-flow integration. steute was surfaced as a portfolio
  company of Battery Ventures.
